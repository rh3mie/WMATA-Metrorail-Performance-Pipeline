name: WMATA ETL Pipeline

on:
  schedule:
    - cron: "*/15 5-23 * * 1-4"   # Mon-Thu 5am-midnight
    - cron: "*/15 5-1 * * 5"      # Fri 5am-2am (next day)
    - cron: "*/15 6-1 * * 6"      # Sat 6am-2am (next day)
    - cron: "*/15 6-23 * * 0"     # Sun 6am-midnight
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install pyarrow pandas-gbq
          pip install -r requirements.txt


      - name: Write GCP service account key
        run: echo '${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}' > service_account.json

      - name: Write .env file
        run: |
          echo "WMATA_API_KEY=${{ secrets.WMATA_API_KEY }}" >> .env
          echo "GOOGLE_APPLICATION_CREDENTIALS=service_account.json" >> .env
          echo "GCP_PROJECT=wmata-transit-pipeline" >> .env
          echo "BQ_DATASET=wmata_transit" >> .env

      - name: Run pipeline
        run: python src/main.py